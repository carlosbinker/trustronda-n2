[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[lint]
# Las variables immutable de TrustRonda (token, organizer, contributionAmount, ...) se dejan en camelCase a
# propósito: son la API pública que lee el frontend y se leen como parámetros de la ronda, no como constantes.
# Analizado y aceptado; ver README > "Warnings analizados".
exclude_lints = ["screaming-snake-case-immutable"]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
line_length = 110
